<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 1 · Formulario de registro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ejercicio1-registro.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <header class="card-header">
        <span class="eyebrow">Registro</span>
        <h1>Crea tu cuenta</h1>
        <p>Los campos con <span class="required-mark">*</span> son obligatorios.</p>
      </header>

      <form action="#" method="post">
        <div class="field">
          <label for="nombre">Nombre completo <span class="required-mark">*</span></label>
          <input type="text" id="nombre" name="nombre" autocomplete="name" placeholder="Laura Martínez" required>
        </div>

        <div class="field">
          <label for="correo">Correo <span class="required-mark">*</span></label>
          <input type="email" id="correo" name="correo" autocomplete="email" placeholder="nombre@correo.com" required>
        </div>

        <div class="field">
          <label for="password">Contraseña <span class="required-mark">*</span></label>
          <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" aria-describedby="password-help" required>
          <small id="password-help" class="help">Mínimo 8 caracteres.</small>
        </div>

        <div class="field">
          <label for="confirmar">Confirmar contraseña <span class="required-mark">*</span></label>
          <input type="password" id="confirmar" name="confirmar" minlength="8" autocomplete="new-password" required>
        </div>

        <!-- confirmación visual de términos: el bloque cambia de estilo cuando se marca -->
        <label class="terms">
          <input type="checkbox" name="terminos" required>
          <span>Acepto los términos y condiciones y la política de privacidad.</span>
        </label>

        <div class="actions">
          <button type="submit" class="button button-primary">Crear cuenta</button>
          <button type="reset" class="button button-secondary">Limpiar</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
