<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 2 · Formulario de reserva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ejercicio2-reserva.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <header class="card-header">
        <span class="eyebrow">Reservas</span>
        <h1>Reserva tu mesa</h1>
        <p>Cuéntanos cuándo quieres visitarnos.</p>
      </header>

      <form action="#" method="post">
        <div class="grid">
          <div class="field">
            <label for="fecha">Fecha <span class="required-mark">*</span></label>
            <input type="date" id="fecha" name="fecha" required>
          </div>
          <div class="field">
            <label for="hora">Hora <span class="required-mark">*</span></label>
            <input type="time" id="hora" name="hora" required>
          </div>
        </div>

        <div class="field">
          <label for="personas">Número de personas <span class="required-mark">*</span></label>
          <input type="number" id="personas" name="personas" min="1" max="20" step="1" value="2" required>
        </div>

        <div class="field">
          <label for="comentarios">Comentarios</label>
          <textarea id="comentarios" name="comentarios" rows="5" maxlength="500" placeholder="Alergias, ocasión especial, preferencia de ubicación..."></textarea>
          <small class="help">Máximo 500 caracteres.</small>
        </div>

        <div class="actions">
          <button type="submit" class="button button-primary">Confirmar reserva</button>
          <button type="reset" class="button button-secondary">Limpiar</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
